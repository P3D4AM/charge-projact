<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- آیکون اپ «مدیریت شارژ ساختمان» — برج + سکه شارژ -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa6f2"/>
      <stop offset="0.55" stop-color="#2f86dd"/>
      <stop offset="1" stop-color="#1d66bd"/>
    </linearGradient>
  </defs>

  <!-- پس‌زمینه گرد -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- برج اصلی -->
  <rect x="138" y="108" width="152" height="284" rx="20" fill="#ffffff"/>
  <!-- پنجره‌های برج اصلی -->
  <rect x="164" y="136" width="34" height="32" rx="9" fill="#2a80d6"/>
  <rect x="230" y="136" width="34" height="32" rx="9" fill="#2a80d6"/>
  <rect x="164" y="192" width="34" height="32" rx="9" fill="#2a80d6"/>
  <rect x="230" y="192" width="34" height="32" rx="9" fill="#2a80d6"/>
  <rect x="164" y="248" width="34" height="32" rx="9" fill="#2a80d6"/>
  <rect x="230" y="248" width="34" height="32" rx="9" fill="#2a80d6"/>
  <!-- در ورودی -->
  <rect x="190" y="334" width="48" height="58" rx="11" fill="#2a80d6"/>

  <!-- برج دوم (کوتاه‌تر، نیمه‌شفاف) -->
  <rect x="312" y="178" width="94" height="214" rx="17" fill="#ffffff" opacity="0.93"/>
  <rect x="331" y="206" width="24" height="22" rx="7" fill="#2a80d6" opacity="0.92"/>
  <rect x="365" y="206" width="24" height="22" rx="7" fill="#2a80d6" opacity="0.92"/>
  <rect x="331" y="248" width="24" height="22" rx="7" fill="#2a80d6" opacity="0.92"/>
  <rect x="365" y="248" width="24" height="22" rx="7" fill="#2a80d6" opacity="0.92"/>

  <!-- سکه شارژ با حرف «ت» (تومان) -->
  <circle cx="368" cy="390" r="72" fill="#ffc94d" stroke="#e8a33d" stroke-width="13"/>
  <path d="M334 384 Q368 404 402 384" fill="none" stroke="#8a5a10" stroke-width="12" stroke-linecap="round"/>
  <circle cx="356" cy="360" r="7.5" fill="#8a5a10"/>
  <circle cx="380" cy="360" r="7.5" fill="#8a5a10"/>
</svg>
