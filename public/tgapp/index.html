<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>مدیریت شارژ ساختمان</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#2f86dd">
  <script src="js/theme-boot.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <header id="hdr">
      <div class="hdr-side">
        <button id="btn-settings" class="icon-btn" hidden aria-label="تنظیمات"></button>
      </div>
      <div class="hdr-title">
        <img class="hdr-logo" src="icon.svg" alt="" aria-hidden="true">
        <span id="bname">مدیریت شارژ ساختمان</span>
        <small id="hsub"></small>
      </div>
      <div class="hdr-side">
        <button id="btn-theme" class="icon-btn" aria-label="تغییر تم"></button>
        <button id="btn-refresh" class="icon-btn" aria-label="بارگذاری مجدد"></button>
      </div>
    </header>
    <main id="main" aria-live="polite"></main>
    <footer class="dev-foot app">
      <span class="df-line">ساخته شده با <span class="df-heart">❤️</span></span>
      <span class="df-line">توسط پدرام ایزدپناه</span>
    </footer>
    <nav id="tabbar" hidden aria-label="ناوبری اصلی"></nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script src="js/lib/qrcode.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
